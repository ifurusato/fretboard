<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title>Chord Tones</title>
  <link rel="stylesheet" type="text/css" href="../fretboard/style/fretboard.css" />
  <link rel="stylesheet" type="text/css" href="./style/chord.css" />
  <script src="../fretboard/script/jquery-1.12.4.min.js"></script>
  <script src="./script/chord.js"></script>
</head>
<body>
<div id="wrapper">
<table id="thead" summary="formatting">
  <tbody><tr>
    <td width="50%" align="left">
      <h1>Chord Tones: <span id="chordtitle"></span></h1>
      <p id="chordformula"></p>
    </td>
    <td width="50%" valign="top" align="right">
      <h1 id="xlink"><a href="../fretboard/">Notes in Scale</a></h1>
    </td>
  </tr>
</tbody></table>
<div class="action">
  <table summary="formatting" border="0">
    <tbody><tr>
      <td align="left">
        <label for="rootselect">Root:</label>&nbsp;
        <select id="rootselect"></select>
        <span style="margin-right:1em"></span>
        <label for="qualityselect">Quality:</label>&nbsp;
        <select id="qualityselect"></select>
      </td>
      <td align="right">
        <div class="position">
          <button id="prev" aria-label="previous position">◀</button>
          <span id="positionlabel"></span>
          <button id="next" aria-label="next position">▶</button>
        </div>
      </td>
    </tr>
    <tr>
      <td colspan="2">
        <label>Extensions:</label>&nbsp;
        <span id="extlist"></span>
      </td>
    </tr>
  </tbody></table>
</div>
<div class="svg">
<svg id="svg2" version="1.2" xmlns="http://www.w3.org/2000/svg" width="1570" height="300">
  <defs id="defs4"></defs>
</svg>
</div>
<p id="footer_copyright">©2026 <a target="_blank" href="http://altheim.com/murray/">Murray Altheim</a>. All Rights Reserved.</p>
</div>
</body>
</html>
