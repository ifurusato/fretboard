<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <title>Chord Tones</title>
  <link rel="stylesheet" type="text/css" href="../fretboard/style/fretboard.css" />
  <script src="../fretboard/script/jquery-1.12.4.min.js"></script>
  <script src="./script/chord.js"></script>
  <style>
    #extlist label {
      font-size: 110%; white-space: nowrap; margin-right: 0.8em;
    }
    #extlist input[type=checkbox] {
      transform: scale(1.3); margin: 0 0.3em 0 0; vertical-align: middle;
    }
    #extlist label:has(input:disabled) { opacity: 0.35; }
    #chordformula {
      color: #c397ed; font-size: 100%; margin: 0 0 0 1em;
    }
    .position {
      display: flex; align-items: center; justify-content: flex-end; gap: 0.6em;
      color: white; font-size: 150%;
    }
    .position button { font-size: 60%; padding: 0.1em 0.5em; }
    #positionlabel { white-space: nowrap; }
    div.svg {
      margin: 1em auto ;
      padding: 1em 1em 0em 1em;
      background-color: #eeeeee ;
      transform: scale(1.0, 1.0);
    }
    #svg2 tspan {
      font-size: 0.95em;
    }
  </style>
</head>
<body>
<div id="wrapper">
<table id="thead" summary="formatting">
  <tbody><tr>
    <td width="50%" align="left">
      <h1>Chord Tones: <span id="chordtitle"></span>&nbsp;<span id="chordformula"></span></h1>
    </td>
    <td width="50%" valign="top" align="right">
      <h1 id="xlink"><a href="../fretboard/">Notes in Scale</a></h1>
    </td>
  </tr>
</tbody></table>
<div class="action">
  <table summary="formatting" border="0">
    <tbody><tr>
      <td align="left">
        <label for="rootselect">Root:</label>&nbsp;
        <select id="rootselect"></select>
        <label for="qualityselect" style="padding-left:1em">Quality:</label>&nbsp;
        <select id="qualityselect"></select>
        <label style="padding-left:1em">Extensions:</label>&nbsp;
        <span id="extlist"></span>
      </td>
      <td align="right">
        <label for="spanselect" style="padding-left:1em; padding-right:0.5em; margin-right:0em;">Span:</label>&nbsp;
        <select id="spanselect"></select>
      </td>
      <td align="right" width="20%">
        <div class="position">
          <button id="prev" style="margin-left:2em" aria-label="previous position">◀</button>
          <span id="positionlabel"></span>
          <button id="next" aria-label="next position">▶</button>
        </div>
      </td>
    </tr>
  </tbody></table>
</div>
<div class="svg">
<svg id="svg2" version="1.2" xmlns="http://www.w3.org/2000/svg" width="1570" height="300">
  <defs id="defs4"></defs>
</svg>
</div>
<p id="footer_copyright">©2026 <a target="_blank" href="http://altheim.com/murray/">Murray Altheim</a>. All Rights Reserved.</p>
</div>
</body>
</html>
